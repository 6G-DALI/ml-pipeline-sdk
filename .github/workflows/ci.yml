name: CI

on: [push, pull_request]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      ZENML_ANALYTICS_OPT_IN: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[example,test,release]'
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Smoke-test the wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -c 'from importlib.metadata import metadata; from dali_mlops import DatasetFile, ExportedModel, TrainingOutput, dali_pipeline, retrieve_dataset, retrieve_csv, retrieve_tsv, retrieve_parquet, retrieve_json, retrieve_jsonl, save_model; import dali_mlops.spec; m = metadata("6g-dali-mlops"); assert (m["Name"], m["Version"], m["Requires-Python"]) == ("6g-dali-mlops", "0.2.0", "<3.13,>=3.12")'
