[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "6g-dali-mlops"
version = "0.1.0"
description = "Data Space retrieval and model publication steps for 6G-DALI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["zenml==0.93.3", "boto3>=1.40,<2", "requests>=2.32,<3", "pandas>=2.2,<3"]

[project.urls]
Repository = "https://github.com/6G-DALI/ml-pipeline-sdk"

[project.optional-dependencies]
example = ["scikit-learn>=1.5,<2", "skl2onnx>=1.19,<2", "onnx>=1.17,<2"]
test = ["zenml[local]==0.93.3", "pytest>=8,<10", "moto[s3]>=5,<6"]
release = ["build>=1,<2", "twine>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
